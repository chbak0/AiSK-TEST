<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A!SK 모의면접 연습기 · 녹화 분석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b2027; --muted:#5d6672; --line:#d9ddd8;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ebf3;
  --prep:#b7791f; --prep-soft:#fbf1df; --rec:#c2362f; --rec-soft:#f9e3e1; --ok:#2e7d55; --ok-soft:#e1f1e8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13171c; --panel:#1b2027; --ink:#e6e9ee; --muted:#9aa3ae; --line:#2c333c;
  --accent:#7fa8d1; --accent-ink:#10161d; --accent-soft:#223244;
  --prep:#e0a84a; --prep-soft:#33291a; --rec:#ef6b62; --rec-soft:#3a201e; --ok:#5fc08c; --ok-soft:#1b3126; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-mono);font-size:22px}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.35}
h2{font-size:17px}
h3{font-size:15px}
.lead{color:var(--muted);margin:6px 0 0;max-width:66ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-size:16px;padding:14px 26px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.tip{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
/* camera */
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam .guide{position:absolute;left:50%;top:46%;width:42%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.45);border-radius:50%}
.cam .live{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.pill.good{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--prep-soft);color:var(--prep);border-color:transparent}
.pill.bad{background:var(--rec-soft);color:var(--rec);border-color:transparent}
.pill.na{color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
.checklist{display:flex;flex-direction:column;gap:8px;font-size:14px}
.checklist div{display:flex;justify-content:space-between;gap:10px;align-items:center}
/* run */
.status{display:flex;gap:6px}
.step{flex:1;height:6px;border-radius:3px;background:var(--line)}
.step.done{background:var(--accent)} .step.now{background:var(--ink)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qtext{font-size:20px;font-weight:600;line-height:1.5;margin:10px 0 0}
.runlay{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.runlay{grid-template-columns:1fr}}
.timer{display:flex;align-items:center;gap:14px;margin-top:14px}
.timer b{font-family:var(--f-mono);font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.badge.prep{background:var(--prep-soft);color:var(--prep)}
.badge.rec{background:var(--rec-soft);color:var(--rec)}
.badge.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.badge.rec::before{animation:none}}
.chart{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.chart svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:5}
.overlay b{font-family:var(--f-mono);font-size:64px}
/* report */
.scorebox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.scorebox{grid-template-columns:1fr}}
.score{border:1px solid var(--line);border-radius:10px;padding:14px}
.score b{font-family:var(--f-mono);font-size:30px;display:block;line-height:1.2}
.score small{color:var(--muted);font-size:12px}
.qrep{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.qrep:first-child{border-top:0;padding-top:0}
.replay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media (max-width:720px){.replay{grid-template-columns:1fr}}
.replay video{width:100%;border-radius:8px;background:#000;display:block}
table.m{width:100%;border-collapse:collapse;font-size:13px}
table.m td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.m td:nth-child(2){font-family:var(--f-mono);white-space:nowrap;text-align:right}
table.m td:last-child{text-align:right;white-space:nowrap}
table.m tr.cat td{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.06em;border-bottom:0;padding-top:12px}
.why{font-size:12px;color:var(--muted)}
textarea,select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
mark{background:var(--prep-soft);color:var(--prep);border-radius:3px;padding:0 2px}
.focus{display:flex;flex-direction:column;gap:8px}
.focus div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.qlist{display:flex;flex-direction:column}
.qitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;align-self:start}
.tag.src{background:var(--ok-soft);color:var(--ok)} .tag.exp{background:var(--accent-soft);color:var(--accent)} .tag.guide{background:var(--prep-soft);color:var(--prep);border:1px solid var(--prep)}
.tag.mine{background:var(--prep-soft);color:var(--prep)}
.sub{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.linkbtn{border:0;background:none;color:var(--rec);font:inherit;font-size:12px;cursor:pointer}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:13px}
.hist span:last-child{font-family:var(--f-mono);color:var(--muted)}
.warnbox{background:var(--prep-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
</style>
</head>

  <header class="top">
    <div class="brand"><b>A!SK SIM</b><span>녹화 · 행동 분석판</span></div>

</div>

async function startMedia(){
  if(M.stream) return true;
  if(!navigator.mediaDevices?.getUserMedia){ throw new Error("이 브라우저에서는 카메라를 쓸 수 없습니다. Chrome 최신 버전에서 열어 주세요."); }
  M.stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
  camEl.srcObject=M.stream; await camEl.play().catch(()=>{});
  M.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=M.audioCtx.createMediaStreamSource(M.stream);
  M.analyser=M.audioCtx.createAnalyser(); M.analyser.fftSize=2048; src.connect(M.analyser);
  M.buf=new Float32Array(M.analyser.fftSize);
  setInterval(audioTick,100);
  loadFace();
  requestAnimationFrame(videoLoop);
  return true;
}
async function loadFace(){
  if(M.faceState!=="idle") return;
  M.faceState="loading"; refreshSetupStatus();
  try{
    const V="0.10.14";
    const vision=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/vision_bundle.mjs`);
    const fs=await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/wasm`);
    const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:d},runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true});
    try{ M.landmarker=await vision.FaceLandmarker.createFromOptions(fs,opts("GPU")); }
    catch(e){ M.landmarker=await vision.FaceLandmarker.createFromOptions(fs,opts("CPU")); }
    M.faceState="ready";
  }catch(e){ console.error(e); M.faceState="error"; }
  refreshSetupStatus();
}

/* 얼굴 프레임 분석 */
const lumCanvas=document.createElement("canvas"); lumCanvas.width=32; lumCanvas.height=24;
const lumCtx=lumCanvas.getContext("2d",{willReadFrequently:true});
let lastVT=-1, lastFrameAt=0;
function videoLoop(now){
  requestAnimationFrame(videoLoop);
  if(!M.landmarker||camEl.readyState<2) return;
  if(now-lastFrameAt<90) return; lastFrameAt=now;
  const t=performance.now(); if(t<=lastVT) return; lastVT=t;
  let r; try{ r=M.landmarker.detectForVideo(camEl,t); }catch(e){ return; }
  const f=parseFace(r);
  M.last.face=f;
  if(M.collecting) M.collecting.frames.push(f||{none:true});
  if(prefs.live && screen==="run") paintLive();
  if(screen==="home") paintSetupLive();
}
function parseFace(r){
  const L=r?.faceLandmarks?.[0]; if(!L) return null;
  const bs={}; (r.faceBlendshapes?.[0]?.categories||[]).forEach(c=>bs[c.categoryName]=c.score);
  let minx=1,maxx=0,miny=1,maxy=0; for(const p of L){ if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x; if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
  const yaw=(L[1].x-L[234].x)/((L[454].x-L[234].x)||1e-6);
  const eyeMidY=(L[33].y+L[263].y)/2;
  const pitch=(L[1].y-eyeMidY)/((L[152].y-eyeMidY)||1e-6);
  const blink=((bs.eyeBlinkLeft||0)+(bs.eyeBlinkRight||0))/2;
  let irisX=null, irisY=null;
  if(L.length>=478 && blink<0.4){
    const rx=(L[468].x-L[33].x)/((L[133].x-L[33].x)||1e-6), lx=(L[473].x-L[362].x)/((L[263].x-L[362].x)||1e-6);
    const ry=(L[468].y-L[159].y)/((L[145].y-L[159].y)||1e-6), ly=(L[473].y-L[386].y)/((L[374].y-L[386].y)||1e-6);
    irisX=(rx+lx)/2; irisY=(ry+ly)/2;
  }
  // 얼굴 밝기
  let lum=null;
  try{ lumCtx.drawImage(camEl,0,0,32,24); const d=lumCtx.getImageData(Math.floor(minx*32),Math.floor(miny*24),Math.max(1,Math.ceil((maxx-minx)*32)),Math.max(1,Math.ceil((maxy-miny)*24))).data;
    let s=0,n=0; for(let i=0;i<d.length;i+=4){ s+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++; } lum=n?s/n:null; }catch(e){}
  return {yaw,pitch,irisX,irisY,blink,smile:((bs.mouthSmileLeft||0)+(bs.mouthSmileRight||0))/2,
    lookDown:((bs.eyeLookDownLeft||0)+(bs.eyeLookDownRight||0))/2,
    cx:(minx+maxx)/2,cy:(miny+maxy)/2,w:maxx-minx,lum};
}
function gazeOf(f){
  const c=M.calib||{yaw:0.5,pitch:0.42,irisX:0.5,irisY:0.42};
  const dy=f.yaw-c.yaw, dp=f.pitch-c.pitch;
  const ix=f.irisX==null?0:f.irisX-c.irisX, iy=f.irisY==null?0:f.irisY-c.irisY;
  const down = dp>0.09 || iy>0.12 || f.lookDown>0.55;
  const off = Math.abs(dy)>0.09 || Math.abs(dp)>0.09 || Math.abs(ix)>0.09 || Math.abs(iy)>0.13;
  return {on:!off, down};
}

/* 음성 */
function audioTick(){
  if(!M.analyser) return;
  M.analyser.getFloatTimeDomainData(M.buf);
  let s=0; for(let i=0;i<M.buf.length;i++) s+=M.buf[i]*M.buf[i];
  const rms=Math.sqrt(s/M.buf.length), db=20*Math.log10(rms+1e-9);
  const floor=M.calib?.noise ?? -60;
  const voiced=db>Math.max(-55,floor+12);
  M.last.db=db; M.last.voiced=voiced;
  let pitch=null; if(voiced) pitch=detectPitch(M.buf,M.audioCtx.sampleRate);
  if(M.collecting) M.collecting.audio.push({db,voiced,pitch});
  if(screen==="home") paintSetupMeter(db);
  if(prefs.live && screen==="run") paintLiveMeter(db);
}
function detectPitch(b,sr){
  const minL=Math.floor(sr/400), maxL=Math.floor(sr/75), n=1024;
  let best=-1,bestL=0;
  for(let l=minL;l<=maxL;l++){ let c=0; for(let i=0;i<n;i++) c+=b[i]*b[i+l]; if(c>best){best=c;bestL=l;} }
  let e=0; for(let i=0;i<n;i++) e+=b[i]*b[i];
  if(!bestL||best/(e+1e-9)<0.3) return null;
  return sr/bestL;
}

function pickMime(){ const c=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"]; return c.find(m=>window.MediaRecorder?.isTypeSupported?.(m))||""; }
function startRec(){
  if(!window.MediaRecorder||!M.stream) return null;
  const mime=pickMime(); const r=new MediaRecorder(M.stream,mime?{mimeType:mime,videoBitsPerSecond:1_200_000}:undefined);
  const chunks=[]; r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const done=new Promise(res=>r.onstop=()=>res(new Blob(chunks,{type:r.mimeType||"video/webm"})));
  r.start(1000); return {r,done};
}

/* 음성 인식 */
function startSR(){
  if(!SR) return null;
  const s={on:true,final:"",rec:null,err:null};
  const mk=()=>{ const r=new SR(); r.lang="ko-KR"; r.continuous=true; r.interimResults=true;
    r.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) s.final+=t+" "; else interim+=t; } s.interim=interim; };
    r.onerror=e=>{ s.err=e.error; };
    r.onend=()=>{ if(s.on && s.err!=="not-allowed" && s.err!=="service-not-allowed"){ try{ s.rec=mk(); s.rec.start(); }catch(e){} } };
    return r; };
  try{ s.rec=mk(); s.rec.start(); }catch(e){ s.err="start"; }
  return s;
}
function stopSR(s){ if(!s) return null; s.on=false; try{s.rec.stop();}catch(e){} return new Promise(res=>setTimeout(()=>res({text:(s.final+(s.interim||"")).trim(),err:s.err}),700)); }

function refreshSetupStatus(){
  if(screen!=="home") return;
  const el=app.querySelector("#checks"); if(!el) return;
  const st=(ok,txt)=>`<span class="pill ${ok===true?"good":ok===false?"bad":ok==="warn"?"warn":"na"}">${txt}</span>`;
  const f=M.last.face;
  const faceTxt=M.faceState==="loading"?st(null,"분석 모델 불러오는 중"):M.faceState==="error"?st(false,"모델 로드 실패"):!M.stream?st(null,"대기"):f?st(true,"인식됨"):st(false,"얼굴 없음");
  const pos=!f?st(null,"-"):(Math.abs(f.cx-0.5)<0.12&&f.w>0.2&&f.w<0.55)?st(true,"적절"):st("warn",f.w<=0.2?"너무 멂":f.w>=0.55?"너무 가까움":"중앙에서 벗어남");

    <div><span>음성 인식 (말 속도·습관어)</span>${SR?st(true,"지원"):st("warn","미지원 · Chrome 권장")}</div>`;

async function calibrate(){
  const btn=app.querySelector("#calib"), msg=app.querySelector("#camMsg");
  btn.disabled=true; msg.textContent="렌즈를 바라보고 조용히 있어 주세요… 3";

  const c=endCollect(); const fr=c.frames.filter(f=>!f.none);
  if(fr.length<5){ msg.textContent="얼굴이 충분히 인식되지 않았습니다. 화면 가운데에 얼굴이 오게 한 뒤 다시 눌러 주세요."; btn.disabled=false; return; }
  const ix=fr.map(f=>f.irisX).filter(v=>v!=null), iy=fr.map(f=>f.irisY).filter(v=>v!=null);
  M.calib={yaw:median(fr.map(f=>f.yaw)),pitch:median(fr.map(f=>f.pitch)),irisX:median(ix)??0.5,irisY:median(iy)??0.42,
    noise:Math.max(-75,median(c.audio.map(a=>a.db))??-60)};
  msg.textContent="기준을 저장했습니다."; btn.disabled=false; refreshSetupStatus();
}

/* ── 출제 ── */
function mixJobs(Q,t){ const sp=shuffle(Q.filter(q=>q.part==="job"&&!q.visual&&q.track!=="all"&&forTrack(q,t))), gn=shuffle(Q.filter(q=>q.part==="job"&&!q.visual&&q.track==="all")); const out=[]; while(sp.length||gn.length){ if(sp.length) out.push(sp.shift()); if(sp.length) out.push(sp.shift()); if(gn.length) out.push(gn.shift()); } return out; }
function buildSet(){
  const t=prefs.track,Q=allQ();
  const commons=Q.filter(q=>q.part==="common"), intro=commons.find(q=>q.fixed), others=shuffle(commons.filter(q=>!q.fixed));
  const jobs=mixJobs(Q,t), visuals=shuffle(Q.filter(q=>q.part==="job"&&forTrack(q,t)&&q.visual));
  const A1=others.find(q=>/^[mh]\d/.test(q.id))||others[0], A2=others.find(q=>/^[gt]\d/.test(q.id)&&q!==A1)||others.find(q=>q!==A1); const p1=[intro,A1,A2].filter(Boolean);
  let p2=jobs.slice(0,4); if(prefs.visualLast&&visuals.length) p2=jobs.slice(0,3).concat(visuals[0]);
  if(prefs.mode==="common") return p1; if(prefs.mode==="job") return p2;
  if(prefs.mode==="one") return [shuffle(others.concat(jobs,visuals))[0]];
  return p1.concat(p2);
}

/* ── 진행 ── */
function startRun(){
  const qs=buildSet(); if(!qs.length) return;
  try{ beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)(); beepCtx.resume?.(); M.audioCtx?.resume?.(); }catch(e){}
  try{ navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{}); }catch(e){}
  run={qs,idx:0,phase:"prep",left:60,total:60,log:qs.map(q=>({id:q.id,prep:0,ans:0,skipped:false}))};
  screen="run"; document.querySelectorAll("[data-go]").forEach(b=>b.setAttribute("aria-current","false"));
  countdown(3,beginPrep);
}
function countdown(n,done){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<span class="label">곧 시작합니다 · 카메라 렌즈를 보세요</span><b>${n}</b>`; document.body.appendChild(ov);
  let k=n; const iv=setInterval(()=>{k--; if(k<=0){clearInterval(iv);ov.remove();done();} else ov.querySelector("b").textContent=k;},1000);
}
function beginPrep(){ run.phase="prep"; run.total=run.left=60; renderRun(); startTick(); }
function beginAnswer(skipped){
  const q=run.qs[run.idx], L=run.log[run.idx];
  L.prep=Math.round(60-run.left); L.skipped=!!skipped;
  run.phase="answer"; run.total=run.left=q.time; beep(880);
  if(M.stream){ beginCollect(); run.cur={rec:startRec(), sr:startSR()}; }
  renderRun(); startTick();
}
async function endAnswer(){
  const i=run.idx, q=run.qs[i], L=run.log[i];
  L.ans=Math.round(run.total-run.left); stopTick(); beep(440);
  if(run.cur){
    const cur=run.cur; run.cur=null; const data=endCollect();
    const p=(async()=>{
      let video=null; if(cur.rec){ try{ cur.rec.r.stop(); video=await cur.rec.done; }catch(e){} }
      const sr=await stopSR(cur.sr);
      L.videoBlob=video; L.videoURL=video?URL.createObjectURL(video):null;
      L.transcript=sr?.text||""; L.srErr=sr?.err||null;
      L.metrics=analyze(q,data,L);
    })();
    L.pending=p;
  }
  if(i<run.qs.length-1){ run.idx++; run.phase="gap"; renderRun(); setTimeout(()=>{ if(run&&run.phase==="gap") beginPrep(); },2500); }
  else finishRun();
}
function startTick(){
  stopTick(); const t0=performance.now(), start=run.left;
  tick=setInterval(()=>{ run.left=start-(performance.now()-t0)/1000;
    if(run.left<=0){ run.left=0; if(run.phase==="prep") beginAnswer(false); else if(run.phase==="answer") endAnswer(); return; }
    paintTimer(); },200);
}
function stopTick(){ if(tick){clearInterval(tick);tick=null;} }
function beep(f){ if(!prefs.beep||!beepCtx) return; try{ const o=beepCtx.createOscillator(),g=beepCtx.createGain(); o.frequency.value=f; o.connect(g); g.connect(beepCtx.destination); g.gain.setValueAtTime(.15,beepCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,beepCtx.currentTime+.35); o.start(); o.stop(beepCtx.currentTime+.36);}catch(e){} }

function renderRun(){
  const q=run.qs[run.idx], part=q.part==="common"?"PART 1 · 공통":"PART 2 · 직무";
  if(run.phase==="gap"){ parkCam(); app.innerHTML=`<div class="panel" style="text-align:center;padding:48px 20px"><div class="label">다음 문항</div><h2 style="margin-top:8px">${run.idx+1} / ${run.qs.length} · ${part}</h2><p class="note">잠시 후 문항이 표시됩니다.</p></div>`; return; }

    <section class="panel runlay">

        ${q.chart?`<div class="chart">${CHARTS[q.chart]()}</div>`:""}
        <div class="timer"><b id="clock">${fmt(run.left)}</b><div class="bar"><i id="tbar" style="background:${col}"></i></div></div>
      </div>
      <div class="grid" style="gap:10px">
        ${M.stream?`<div class="cam" id="runCam"><div class="live" id="live"></div></div>`:`<div class="note">카메라가 꺼져 있어 녹화·분석 없이 진행됩니다.</div>`}
        ${M.stream&&prefs.live?`<div class="meter"><i id="runmic"></i></div>`:""}
      </div>
    </section>
    <div class="row spread">
      <span class="note">${prep?"준비 시간이 끝나면 녹화가 자동으로 시작됩니다.":"시간이 끝나면 다음 문항으로 넘어갑니다."}</span>
      <div class="row"><button class="btn" id="quit">그만두기</button>${prep?`<button class="btn primary" id="skip">준비 건너뛰고 답변 시작</button>`:`<button class="btn primary" id="done">답변 종료</button>`}</div>
    </div>
  </div>`;
  if(M.stream) mountCam(app.querySelector("#runCam"));
  app.querySelector("#quit").onclick=()=>{ stopTick(); if(run.cur){ try{run.cur.rec?.r.stop();}catch(e){} stopSR(run.cur.sr); endCollect(); } releaseWake(); run=null; go("home"); };
  const sk=app.querySelector("#skip"); if(sk) sk.onclick=()=>{ stopTick(); beginAnswer(true); };
  const dn=app.querySelector("#done"); if(dn) dn.onclick=()=>endAnswer();
  paintTimer();
}
function paintTimer(){

  const dn=document.getElementById("done");
  if(dn){ const used=run.total-run.left, lock=prefs.minAnswer&&used<30; dn.disabled=lock; dn.textContent=lock?`답변 종료 (${Math.ceil(30-used)}초 후)`:"답변 종료"; }
}
let livePaint=0;

function releaseWake(){ try{wake?.release();}catch(e){} wake=null; }

async function finishRun(){

const CATW={"시각":40,"음성":35,"언어":25};
function interp(c,x){ if(x<=c[0][0]) return c[0][1]; for(let i=1;i<c.length;i++){ if(x<=c[i][0]){ const [x0,y0]=c[i-1],[x1,y1]=c[i]; return y0+(y1-y0)*(x-x0)/(x1-x0); } } return c[c.length-1][1]; }
const stOf=s=>s==null?"na":s>=80?"good":s>=55?"warn":"bad";
function gradeOf(s){ if(s==null) return {g:"-",cls:"na"}; return s>=85?{g:"우수",cls:"good"}:s>=70?{g:"합격권",cls:"good"}:s>=55?{g:"보완 필요",cls:"warn"}:{g:"미흡",cls:"bad"}; }

function analyze(q,d,L){
  const m=[];
  const add=(cat,key,label,val,raw,why,sOverride)=>{ const sp=SPEC[key]; let s=null;
    if(sOverride!=null) s=sOverride; else if(sp&&sp.c&&raw!=null&&!Number.isNaN(raw)) s=Math.round(interp(sp.c,raw));
    m.push({cat,key,label,val,raw,s,w:sp?.w||0,status:stOf(s),why}); };
  const fr=d.frames, faces=fr.filter(f=>!f.none), N=fr.length, dur=d.dur||L.ans||1;
  if(M.faceState==="ready" && N>5){
    const facePct=pct(faces.length,N);
    add("시각","face","얼굴 인식률",facePct+"%",facePct,"화면 밖으로 나가거나 손으로 가리면 평가가 어려워집니다.");
    if(faces.length>5){
      const gz=faces.map(gazeOf), onPct=pct(gz.filter(g=>g.on).length,faces.length), downPct=pct(gz.filter(g=>g.down).length,faces.length);
      add("시각","gaze","카메라 응시율",onPct+"%",onPct,"화면 속 얼굴이 아니라 렌즈를 볼 때 면접관과 눈을 맞추는 것으로 보입니다.");
      add("시각","down","아래를 본 비율",downPct+"%",downPct,"아래 시선이 길면 메모나 원고를 읽는 것으로 비칠 수 있습니다.");
      let breaks=0,r2=0; for(const g of gz){ if(!g.on){ r2++; if(r2===7) breaks++; } else r2=0; }
      const bpm=+(breaks/(dur/60)).toFixed(1);
      add("시각","breaks","시선 이탈 횟수",`${breaks}회 (${bpm}/분)`,bpm,"0.7초 이상 렌즈에서 벗어난 횟수입니다.");
      const mv=Math.max(std(faces.map(f=>f.yaw))||0,std(faces.map(f=>f.pitch))||0);
      add("시각","head","고개 움직임",mv<0.03?"적음":mv<0.06?"보통":"많음",mv,"고개를 자주 흔들거나 기울이면 불안해 보입니다. 가벼운 끄덕임은 괜찮습니다.");
      let blinks=0,prev=false; for(const f of faces){ const b=f.blink>0.5; if(b&&!prev) blinks++; prev=b; }
      const blpm=Math.round(blinks/(dur/60));
      add("시각","blink","눈 깜빡임",`${blpm}회/분`,blpm,"긴장하면 늘어납니다. 보통 분당 15~25회입니다.");
      const smilePct=pct(faces.filter(f=>f.smile>0.3).length,faces.length);
      add("시각","smile","미소·표정",smilePct+"%",smilePct,"처음과 끝에 가볍게 웃으면 인상이 부드러워집니다.");
      const cxDev=mean(faces.map(f=>Math.abs(f.cx-0.5))), w=mean(faces.map(f=>f.w)), ok=cxDev<0.12&&w>0.2&&w<0.55;
      add("시각","pos","얼굴 위치",ok?"적절":w<=0.2?"너무 멂":w>=0.55?"너무 가까움":"치우침",ok?1:0,"얼굴이 화면 가운데, 어깨까지 보이는 거리가 좋습니다.");
      const lum=mean(faces.map(f=>f.lum).filter(v=>v!=null));
      if(lum!=null) add("시각","light","얼굴 밝기",Math.round(lum)+"",lum,"얼굴 앞쪽에 조명을 두고 역광을 피하세요.");
    }
  }
  const A=d.audio;
  if(A.length>10){
    const firstV=A.findIndex(a=>a.voiced), delay=firstV<0?dur:firstV*0.1;
    add("음성","delay","답변 시작까지",delay.toFixed(1)+"초",delay,"녹화가 시작되면 2초 안에 첫 문장을 시작하세요.");
    const after=firstV<0?[]:A.slice(firstV), vc=after.filter(a=>a.voiced).length, voicedPct=pct(vc,after.length||1)??0;
    add("음성","talk","발화 비율",voicedPct+"%",voicedPct,"말을 시작한 뒤 실제로 소리를 낸 시간의 비율입니다.");
    let pauses=0,sil=0,longest=0; for(const a of after){ if(!a.voiced){ sil++; if(sil===20) pauses++; longest=Math.max(longest,sil);} else sil=0; }
    add("음성","pause","2초 이상 침묵",`${pauses}회 · 최장 ${(longest*0.1).toFixed(1)}초`,pauses,"긴 침묵은 막힌 것으로 보입니다. 생각이 필요하면 연결어로 이어 가세요.");
    const vdb=after.filter(a=>a.voiced).map(a=>a.db), noise=M.calib?.noise??median(A.map(a=>a.db));
    if(vdb.length){ const snr=Math.round(median(vdb)-noise); add("음성","vol","목소리 크기 (소음 대비)",snr+" dB",snr,"작은 목소리는 자신감이 없어 보이고 음성 인식도 떨어집니다."); }
    const ps=after.map(a=>a.pitch).filter(p=>p&&p>70&&p<420);
    if(ps.length>15){ const mid=median(ps), sd=std(ps.map(p=>12*Math.log2(p/mid))); add("음성","pitch","억양 변화",sd.toFixed(1)+" 반음",sd,"높낮이 변화가 적으면 외운 답을 읽는 것처럼 들립니다."); }
    L.voicedSec=vc*0.1;
  }
  { const ratio=L.ans/q.time, cut=ratio>=0.995;
    const c=q.part==="common"?[[0,0],[0.5,30],[0.6,80],[0.75,100],[0.95,100],[0.995,60]]:[[0,0],[0.3,30],[0.5,80],[0.65,100],[0.95,100],[0.995,60]];
    let s=Math.round(interp(c,ratio)); if(L.ans<30) s=Math.min(s,15);
    add("음성","time","시간 활용",`${fmt(L.ans)} / ${fmt(q.time)}`,ratio,cut?"시간이 끝나 답변이 끊겼습니다. 결론을 먼저 말해 두면 끊겨도 손해가 적습니다.":q.part==="common"?"공통 문항은 40~55초가 적당합니다.":"직무 문항은 1분 30초~2분 40초 정도로 충분히 설명하세요.",s); }
  const T=(L.transcript||"").trim();
  if(T){
    const syl=(T.match(/[가-힣]/g)||[]).length+(T.match(/[A-Za-z]+|\d+/g)||[]).length;
    const rate=Math.round(syl/(Math.max(5,L.voicedSec||L.ans)/60));
    add("언어","rate","말 속도",`${rate} 음절/분`,rate,rate>380?"빠르게 말하면 긴장한 것처럼 들리고 전달력이 떨어집니다.":rate<260?"너무 느리면 답이 준비되지 않은 것처럼 보입니다.":"알아듣기 좋은 속도입니다.");
    const fc={}; let fn=0; T.split(/\s+/).forEach(w=>{ const c=w.replace(/[.,?!…~]/g,""); if(FILLERS.includes(c)){ fc[c]=(fc[c]||0)+1; fn++; } });
    const fpm=+(fn/(L.ans/60||1)).toFixed(1);
    add("언어","filler","습관어",fn?`${fn}회 (${Object.entries(fc).map(([k,v])=>k+" "+v).join(", ")})`:"0회",fpm,"'음, 어, 약간, 뭔가'가 잦으면 준비가 덜 된 인상을 줍니다. 음성 인식이 일부를 빼고 받아쓰기도 합니다.");
    L.fillerWords=Object.keys(fc);
    if(q.kind==="exp"||q.kind==="motive"){ const nums=(T.match(NUMRE)||[]).length; add("언어","num","수치·구체 표현",nums+"회",nums,"'수율을 3% 높였다'처럼 숫자가 들어가면 경험이 구체적으로 들립니다."); }
    if(q.kind==="exp"){ const hit=Object.entries(STAR).filter(([,re])=>re.test(T)).map(([k])=>k);
      add("언어","star","경험 구조 (상황·행동·결과)",hit.length?hit.join("·"):"없음",hit.length,"상황 → 내가 한 행동 → 결과가 모두 드러나야 합니다."); }
    if(q.kw?.length){ const lt=T.toLowerCase(), hit=q.kw.filter(k=>lt.includes(k.toLowerCase())), p=pct(hit.length,q.kw.length);
      add("언어","kw","핵심 개념어",`${hit.length}/${q.kw.length}`,p,"빠진 개념어: "+(q.kw.filter(k=>!hit.includes(k)).slice(0,5).join(", ")||"없음")); }
  } else {
    m.push({cat:"언어",key:"sr",label:"음성 인식",val:SR?(L.srErr?`실패 (${L.srErr})`:"인식된 말 없음"):"미지원",s:null,w:0,status:"na",
      why:L.srErr==="not-allowed"?"음성 인식 권한이 막혀 있습니다. localhost 주소로 열면 해결되는 경우가 많습니다.":"받아쓴 답변 칸에 직접 적으면 Claude 평가에는 반영됩니다."});
  }
  return m;
}
function wavg(ms){ let a=0,b=0; ms.forEach(x=>{ if(x.s!=null&&x.w){ a+=x.s*x.w; b+=x.w; } }); return b?Math.round(a/b):null; }
function catScore(ms,cat){ return wavg(ms.filter(x=>x.cat===cat)); }
function totalScore(ms){ const parts=Object.entries(CATW).map(([c,w])=>[catScore(ms,c),w]).filter(([s])=>s!=null); const tw=parts.reduce((a,[,w])=>a+w,0); return tw?Math.round(parts.reduce((a,[s,w])=>a+s*w,0)/tw):null; }
function sessionScores(){ const all=run.log.flatMap(l=>l.metrics||[]); return {visual:catScore(all,"시각"),vocal:catScore(all,"음성"),verbal:catScore(all,"언어"),total:totalScore(all),all}; }

/* ═════════ 리포트 ═════════ */
function highlight(t,fills){ let h=esc(t); (fills||[]).forEach(w=>{ h=h.replace(new RegExp(`(^|\\s)(${w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})(?=\\s|$|[.,])`,"g"),"$1<mark>$2</mark>"); }); return h; }
const KIND={intro:"자기소개",motive:"지원동기",exp:"경험"};

  const focus=Object.values(loss).filter(f=>f.worst<80).sort((a,b)=>b.v-a.v).slice(0,3);

    <section class="panel grid" style="gap:22px">
      ${run.qs.map((q,i)=>{ const L=run.log[i], ms=L.metrics||[], qs=totalScore(ms), qg=gradeOf(qs);
        const rows=["시각","음성","언어"].map(c=>{ const r=ms.filter(x=>x.cat===c); return r.length?`<tr class="cat"><td colspan="4">${c} ${catScore(r,c)??""}</td></tr>`+r.map(x=>`<tr><td>${esc(x.label)}<div class="why">${esc(x.why)}</div></td><td>${esc(x.val)}</td><td style="font-family:var(--f-mono);text-align:right">${x.s??"-"}</td><td><span class="pill ${x.status}">${({good:"좋음",warn:"보통",bad:"부족",na:"-"})[x.status]}</span></td></tr>`).join(""):""; }).join("");

const RUBRIC=`[내용 채점 기준 · 문항당 100점]
- 두괄식 (20): 첫 문장에서 질문에 대한 결론이나 핵심을 말했는가
- 핵심 내용 (40): 공통 문항은 경험의 구체성(상황·내 역할·행동·결과, 수치). 직무 문항은 개념 정확성과 원리 설명. 틀린 내용은 반드시 지적하고 감점

받아쓴 답변은 음성 인식 결과라 오타가 있을 수 있습니다. 문맥상 명백한 인식 오류는 보정하되, 보정한 부분을 표시해 주세요.

[종합 점수] 내용 평균 × 0.6 + 행동 점수 × 0.4
[등급] 85 이상 우수 · 70~84 합격권 · 55~69 보완 필요 · 55 미만 미흡`;

질문: ${q.text}${q.chart?`\n자료: ${CHART_DESC[q.chart]}`:""}
답변 시간: ${L.ans}초 / 최대 ${q.time}초 · 행동 점수 ${totalScore(L.metrics||[])??"-"}
보완이 필요한 행동 지표: ${weak||"없음"}
답변(받아쓰기):
${(L.transcript||"").trim()||"(받아쓴 내용 없음)"}`; }).join("\n");
  const out=one?`
[출력 형식]

2. 틀렸거나 빠진 내용
3. 가장 먼저 고칠 점 2가지 (행동 지표 포함)
4. 개선된 답변 예시 (${run.qs[idx[0]].time===60?"50초":"2분 30초"} 분량, 말하는 문장으로)`:`
[출력 형식]
1. 문항별 표: 번호 | 두괄식 | 핵심 내용 | 연결 | 완결성 | 내용 점수 | 한 줄 평
2. 내용 평균, 종합 점수, 등급
3. 전체에서 가장 먼저 고칠 점 3가지 (행동 지표 포함)
4. 직무 문항에서 틀렸거나 빠진 개념 정리
5. 점수가 가장 낮은 두 문항의 개선된 답변 예시 (말하는 문장으로, 시간 분량에 맞게)`;
  return head+body+"\n\n"+RUBRIC+"\n"+out;
}

async function sendToClaude(idx,note,open){
  const txt=buildPrompt(idx);
  let copied=false;
  try{ await navigator.clipboard.writeText(txt); copied=true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ copied=document.execCommand("copy"); }catch(_){} ta.remove(); }
  if(open){
    const enc=encodeURIComponent(txt);
    const url=enc.length<=12000?"https://claude.ai/new?q="+enc:"https://claude.ai/new";
    window.open(url,"_blank","noopener");
    note.textContent=copied?(enc.length<=12000?"새 탭을 열었습니다. 입력창이 비어 있으면 붙여 넣기 하세요.":"답변이 길어 자동 입력 대신 복사했습니다. 새 탭 입력창에 붙여 넣기 하세요."):"복사하지 못했습니다. '복사만 하기'를 다시 눌러 주세요.";
  } else note.textContent=copied?"복사했습니다. Claude 채팅에 붙여 넣으세요.":"복사하지 못했습니다.";
}

function buildData(idx){
  const s=sessionScores(), all=idx.length===run.qs.length;
  return {v:1,trackName:TRACKS[prefs.track].name,
    date:new Date().toLocaleString("ko-KR",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}),
    behavior: all?{total:s.total,visual:s.visual,vocal:s.vocal,verbal:s.verbal}:{total:totalScore(run.log[idx[0]].metrics||[])},
    items: idx.map(i=>{ const q=run.qs[i], L=run.log[i], ms=(L.metrics||[]).filter(x=>x.s!=null);
      return {n:i+1,part:q.part,kindName:KIND[q.kind]||"",visual:!!q.visual,text:q.text,chartDesc:q.chart?CHART_DESC[q.chart]:"",
        time:q.time,ans:L.ans,bscore:totalScore(L.metrics||[]),weak:ms.filter(x=>x.s<80).map(x=>`${x.label} ${x.val}`),transcript:(L.transcript||"").trim()}; })};
}
async function handoff(idx,note){
  const txt="ASKSIM 녹화 결과 · A!SK 연습기의 '녹화 결과 평가' 화면에 붙여 넣으세요\n"+JSON.stringify(buildData(idx));

  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); }
  window.open(EVAL_URL,"_blank","noopener");
  note.textContent=ok?"복사했습니다. 새 탭의 평가 화면에서 상자를 클릭하고 붙여 넣기 하세요.":"복사하지 못했습니다. 다시 눌러 주세요.";
}

const CHARTS={
  spc(){ const d=[100.4,99.6,100.9,99.2,100.1,100.7,99.5,100.3,99.8,100.6,99.4,100.2,100.8,99.7,99.9,100.4,100.9,101.5,101.9,102.4,102.8,103.6,100.3,99.8,100.5],W=520,H=230,L=52,R=56,T=16,B=32;

  retention(){ const bins=[1,1.25,1.5,1.75,2,2.25,2.5,2.75,3,3.25,3.5,3.75,4,4.25,4.5],
      a=[0,0,0,0,0,1,1,2,4,9,18,28,22,11,4], b=[0,1,1,2,4,8,15,24,22,13,6,3,1,0,0],W=520,H=230,L=40,R=14,T=24,B=40;

    const r=x(Math.log10(64));
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="25도와 85도 Retention time 분포">${g}
      <line x1="${r}" x2="${r}" y1="${T-8}" y2="${y(0)}" stroke="var(--prep)" stroke-dasharray="4 4"/><text x="${r+5}" y="${T-2}" style="fill:var(--prep)">64 ms</text>

      <text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">Retention time (로그 축) · 셀 비율</text></svg>`; },
  yield(){ const d=[92.4,92.1,92.8,92.5,92.6,86.9,84.7,85.3,88.9,91.6],W=520,H=230,L=46,R=14,T=22,B=36;
    const x=i=>L+i*(W-L-R)/(d.length-1), y=v=>T+(96-v)/16*(H-T-B); let g="";
    for(let v=80;v<=96;v+=4) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
    d.forEach((_,i)=>g+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle">W${i+1}</text>`);

      <polyline points="${d.map((v,i)=>x(i)+","+y(v)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      ${d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${i===6?"var(--rec)":"var(--accent)"}"/>`).join("")}</svg>`; },
  wafer(){ const N=15,S=14,cx=N*S/2,R=cx-2,p=20; let s="";
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){ const px=c*S+S/2,py=r*S+S/2,dist=Math.hypot(px-cx,py-cx); if(dist>R-S/2) continue;
      const edge=dist>R-S*2.2, seed=(r*31+c*17)%11, fail=edge?seed<7:(seed===0&&(r+c)%5===0);
      s+=`<rect x="${p+c*S+1}" y="${p+r*S+1}" width="${S-2}" height="${S-2}" rx="1.5" fill="${fail?"var(--rec)":"var(--ok-soft)"}" stroke="${fail?"var(--rec)":"var(--ok)"}" stroke-opacity=".5"/>`; }
    const X=N*S+p*2;
    return `<svg viewBox="0 0 ${X+160} ${X}" role="img" aria-label="웨이퍼 맵"><circle cx="${p+cx}" cy="${p+cx}" r="${R+3}" fill="none" stroke="var(--muted)"/>${s}
      <rect x="${X+10}" y="${p+10}" width="12" height="12" fill="var(--rec)"/><text x="${X+28}" y="${p+20}">Fail die</text>
      <rect x="${X+10}" y="${p+32}" width="12" height="12" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="${X+28}" y="${p+42}">Pass die</text>
      <text x="${X+10}" y="${p+72}">Lot B07 · W#12</text></svg>`; },
  shmoo(){ const v=[1.00,1.05,1.10,1.15,1.20,1.25,1.30],t=[0.625,0.75,0.833,0.938,1.071,1.25],L=58,T=16,cw=58,ch=26; let s="";
    v.forEach((vv,vi)=>{ t.forEach((tt,ti)=>{ let ok=ti>=[5,4,3,2,1,0,0][vi]; if(vi===6&&ti===0) ok=false;
      s+=`<rect x="${L+ti*cw+1}" y="${T+(v.length-1-vi)*ch+1}" width="${cw-2}" height="${ch-2}" rx="2" fill="${ok?"var(--ok-soft)":"var(--rec-soft)"}" stroke="${ok?"var(--ok)":"var(--rec)"}" stroke-opacity=".6"/><text x="${L+ti*cw+cw/2}" y="${T+(v.length-1-vi)*ch+ch/2+4}" text-anchor="middle" style="fill:${ok?"var(--ok)":"var(--rec)"}">${ok?"P":"F"}</text>`; });
      s+=`<text x="${L-8}" y="${T+(v.length-1-vi)*ch+ch/2+4}" text-anchor="end">${vv.toFixed(2)}V</text>`; });
    t.forEach((tt,ti)=>s+=`<text x="${L+ti*cw+cw/2}" y="${T+v.length*ch+16}" text-anchor="middle">${tt}</text>`);
    const W=L+t.length*cw+12,H=T+v.length*ch+40;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Shmoo plot">${s}<text x="${L+t.length*cw/2}" y="${H-4}" text-anchor="middle">tCK (ns) → 길수록 느린 클럭</text></svg>`; }
};
